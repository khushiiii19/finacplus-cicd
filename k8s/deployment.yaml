apiVersion: apps/v1
kind: Deployment
metadata:
  name: finacplus-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finacplus-app
  template:
    metadata:
      labels:
        app: finacplus-app
    spec:
      containers:
        - name: finacplus-app
          image: finacplus-cicd:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
